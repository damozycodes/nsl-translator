services:
  nsl:
    build: .
    # Match Render's Linux architecture, including on Apple Silicon.
    platform: linux/amd64
    ports:
      - "127.0.0.1:8502:10000"
    environment:
      PORT: "10000"
    volumes:
      - ./dataset:/app/dataset:ro
      - nsl-results:/app/results
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["share"]
    command: tunnel --no-autoupdate --url http://nsl:10000
    depends_on:
      nsl:
        condition: service_healthy
    restart: "no"

volumes:
  nsl-results:
